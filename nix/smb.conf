# User-level Samba config for the homelab box.
# smbd runs as frai (no sudo / no NixOS), so it listens on 4455, not 445.
# From a Mac: Finder → Go → Connect to Server → smb://10.0.0.101:4455/home
#
# fruit/streams_xattr is omitted on purpose: it returns NT_STATUS_ACCESS_DENIED
# when smbd is unprivileged inside nix-user-chroot. Finder is fine over SMB2.

[global]
   workgroup = WORKGROUP
   server string = homelab
   server role = standalone server
   security = user
   map to guest = Bad User
   guest account = frai
   smb ports = 4455
   server smb transports = tcp:4455
   disable netbios = yes
   server min protocol = SMB2
   bind interfaces only = yes
   interfaces = ens18 127.0.0.1
   hosts allow = 10.0.0. 127.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   usershare max shares = 0
   nt acl support = no
   ea support = no
   log file = /home/frai/.local/share/samba/log/log.%m
   log level = 1
   private dir = /home/frai/.local/share/samba/private
   lock directory = /home/frai/.local/share/samba/lock
   pid directory = /home/frai/.local/share/samba/pid
   state directory = /home/frai/.local/share/samba/state
   cache directory = /home/frai/.local/share/samba/cache
   ncalrpc dir = /home/frai/.local/share/samba/ncalrpc

[home]
   path = /home/frai
   browseable = yes
   read only = no
   guest ok = yes
   create mask = 0644
   directory mask = 0755
   veto files = /.DS_Store/._*/
   delete veto files = yes
